[project]
name = "uzbek-local-voice-ai-service"
version = "0.1.0"
description = "Project-local Uzbek STT, GGUF LLM, and TTS service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "huggingface-hub>=0.26",
  "psutil>=6.1",
  "numpy>=1.26"
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.5"]
stt = ["nemo-toolkit[asr]>=2.0"]
tts = ["qwen-tts>=0.1", "soundfile>=0.12"]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../../tests/unit"]
